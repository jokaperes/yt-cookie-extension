<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      width: 320px;
      padding: 20px;
      background: #0f0f0f;
      color: #fff;
    }
    h2 {
      margin: 0 0 15px;
      font-size: 16px;
      color: #ff4444;
    }
    .info {
      font-size: 12px;
      color: #aaa;
      margin-bottom: 15px;
      line-height: 1.4;
    }
    button {
      width: 100%;
      padding: 12px;
      background: #ff4444;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 10px;
    }
    button:hover {
      background: #ff6666;
    }
    button:disabled {
      background: #666;
      cursor: not-allowed;
    }
    .status {
      font-size: 11px;
      color: #4caf50;
      text-align: center;
      min-height: 20px;
    }
    .warning {
      background: #2a2a2a;
      padding: 10px;
      border-radius: 6px;
      font-size: 11px;
      color: #ffaa00;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <h2>YouTube Cookie Exporter</h2>
  <p class="info">Export your YouTube session cookies for use with yt-dlp on a server.</p>
  <button id="exportBtn">Export Cookies.txt</button>
  <div id="status" class="status"></div>
  <div class="warning">
    Warning: Cookies are like session tokens. Don't share them publicly. Delete after use.
  </div>
  <script src="popup.js"></script>
</body>
</html>
